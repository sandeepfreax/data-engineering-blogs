version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: airbnb
      MYSQL_USER: airbnb_user
      MYSQL_PASSWORD: airbnb_password
      MYSQL_ROOT_PASSWORD: root_password
      # Required for some LOAD DATA LOCAL INFILE workflows
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      # Persistent MySQL data
      - /Users/sandeepkumar/Applications/docker-containers-donotdelete/mysql-8:/var/lib/mysql
      # Optional: mount raw CSVs so you can LOAD DATA from inside the container
      - ../input_raw_data:/var/lib/mysql-files
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  metabase:
    image: metabase/metabase:v0.61.2.x
    container_name: airbnb_metabase
    ports:
      - "3000:3000"
    environment:
      # Optional but useful to keep Metabase metadata in a file-based H2 DB
      MB_DB_FILE: /metabase-data/metabase.db
      # Set your preferred JVM options if needed, e.g. memory limits
      # JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - /Users/sandeepkumar/Applications/docker-containers-donotdelete/metabase-0.61:/metabase-data
    depends_on:
      mysql:
        condition: service_healthy