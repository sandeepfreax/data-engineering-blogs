name: statcan_lakehouse
version: "1.0.0"
config-version: 2

profile: statcan_lakehouse

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

on-run-start:
  - "CREATE OR REPLACE TEMPORARY VIEW silver_lfs_province AS SELECT * FROM delta.`{{ env_var('SILVER_PROVINCE_PATH') }}`"
  - "CREATE OR REPLACE TEMPORARY VIEW silver_lfs_industry AS SELECT * FROM delta.`{{ env_var('SILVER_INDUSTRY_PATH') }}`"

models:
  statcan_lakehouse:
    staging:
      +materialized: ephemeral
    gold:
      +materialized: table
      +file_format: delta